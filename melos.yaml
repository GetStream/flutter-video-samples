name: flutter_video_samples

packages:
  - packages/*
  - packages/quickstart_kits/*

scripts:
  lint:all:
    run: melos run analyze && melos run format
    description: Run all static analysis checks (analyze + format check).

  analyze:
    run: |
      melos exec -c 5 -- \
        dart analyze --fatal-infos .
    description: |
      Run `dart analyze` in all packages.
       - Note: you can also rely on your IDEs Dart Analysis / Issues window.

  analyze:warnings:
    run: |
      melos exec -c 5 -- \
        dart analyze --fatal-warnings .
    description: |
      Run `dart analyze` in all packages.
       Flags all compiler `errors` in the project.

  format:
    run: |
      melos exec -c 5 -- \
        dart format --output=none --set-exit-if-changed .
    description: |
      Check formatting in all packages without writing changes.
      Fails if any file needs formatting - run `melos run format:fix` to apply.

  format:fix:
    run: |
      melos exec -c 5 -- \
        dart format .
    description: Format all packages in place.

  test:
    run: melos exec -c 4 --fail-fast -- "flutter test"
    description: Run Flutter tests in every package that has a `test` directory.
    select-package:
      dir-exists: test

  build:android:
    run: melos exec -c 1 --fail-fast -- "flutter build apk --debug"
    description: |
      Build a debug APK for every sample. Verifies each sample still compiles,
      e.g. after a Stream SDK version bump.

  build:ios:
    run: melos exec -c 1 --fail-fast -- "flutter build ios --debug --no-codesign"
    description: |
      Build every sample for iOS (unsigned). Requires macOS with Xcode.

  clean:flutter:
    run: melos exec -c 4 --fail-fast -- "flutter clean"
    description: Run `flutter clean` in all packages.

  postclean:
    run: melos run clean:flutter --no-select
    description: Runs "flutter clean" in all Flutter packages after `melos clean`.
