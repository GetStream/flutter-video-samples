name: video_livestream_overlay
description: "A livestreaming sample app that burns a scoreboard overlay into the publisher's video using a native video filter."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.0
  permission_handler: ^12.0.1
  stream_video_filters: ^1.4.0
  stream_video_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
