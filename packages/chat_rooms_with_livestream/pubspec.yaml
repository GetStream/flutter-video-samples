name: chat_rooms_with_livestream
description: "A creator-community sample where members chat in predefined rooms and content creators go live inside a room for everyone else to watch."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  stream_chat_flutter: ^10.0.0
  stream_video_flutter: ^1.6.0
  permission_handler: ^12.0.1
  # Benchmark mode only (lib/bench/): where the recording is written, and
  # handing it off the device.
  path_provider: ^2.1.5
  share_plus: ^13.3.0

dependency_overrides:
  file_picker: ^12.0.0-beta.5
  stream_video:
    git:
      url: https://github.com/GetStream/stream-video-flutter.git
      path: packages/stream_video
      ref: 021b678f257d3993230ffe2cb6b2b1c72d327fe4
  stream_video_flutter:
    git:
      url: https://github.com/GetStream/stream-video-flutter.git
      path: packages/stream_video_flutter
      ref: 021b678f257d3993230ffe2cb6b2b1c72d327fe4
  stream_chat:
    git:
      url: https://github.com/GetStream/stream-chat-flutter.git
      path: packages/stream_chat
      ref: 6d741e5c9718a7ade71ed09babd3f209902cc60d
  stream_chat_flutter:
    git:
      url: https://github.com/GetStream/stream-chat-flutter.git
      path: packages/stream_chat_flutter
      ref: 6d741e5c9718a7ade71ed09babd3f209902cc60d
  stream_chat_flutter_core:
    git:
      url: https://github.com/GetStream/stream-chat-flutter.git
      path: packages/stream_chat_flutter_core
      ref: 6d741e5c9718a7ade71ed09babd3f209902cc60d
  stream_core_flutter:
    git:
      url: https://github.com/GetStream/stream-core-flutter.git
      path: packages/stream_core_flutter
      ref: b6f5e1cc64b73a4e6f8cad7d53280dcc87efcf8d
  stream_webrtc_flutter:
    git:
      url: https://github.com/GetStream/webrtc-flutter.git
      ref: 3552bc68e48aa40e257c2015b20f286598536d6e
    # path: ../../../webrtc-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
