name: video_ringing_with_chat_push
description: "A showcase app for Stream Video Flutter ringing functionality."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  stream_video_flutter: ^1.4.0
  stream_video_push_notification: ^1.4.0
  stream_chat: ^9.23.0
  stream_chat_flutter: ^9.23.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  flutter_local_notifications: ^20.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
